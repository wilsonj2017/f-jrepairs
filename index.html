<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F&J REPAIRS SRL - Panel Central de Flota, Inspección Pre-Uso y Mantenimientos</title>
  <meta name="description" content="Sistema oficial de F&J REPAIRS SRL para control de mantenimientos, inspecciones pre-uso con cálculo de horómetro y acceso a documentación técnica mediante códigos QR para proyectos de torres eléctricas y subestaciones.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=2.5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>">
</head>
<body class="page-desktop">

  <div class="enterprise-app-layout">
    <!-- Left Sidebar (INFOTEP Enterprise Style) -->
    <aside class="enterprise-sidebar">
      <div class="sidebar-brand" onclick="App.returnToDashboard()" title="F&J REPAIRS SRL">
        <div class="sidebar-brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.8L18.2 19H5.8L12 5.8zM11 11h2v4h-2zm0 5h2v2h-2z"/></svg>
        </div>
        <div class="sidebar-brand-text">
          <div class="sidebar-title">F&J REPAIRS</div>
          <div class="sidebar-sub">Gestión de Flota & QR</div>
        </div>
      </div>

      <div class="sidebar-nav-group-title">FLOTA & OPERACIONES</div>
      <nav class="sidebar-nav">
        <button class="sidebar-nav-item active" id="nav-item-flota" onclick="App.returnToDashboard()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
          <span>Consultar Flota</span>
        </button>
        <button class="sidebar-nav-item" id="nav-item-mantenimiento" onclick="App.openModuleMaintenance()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
          <span>Registrar Mantenimiento</span>
        </button>
        <button class="sidebar-nav-item" id="nav-item-programas-mant" onclick="App.openMaintenanceProgramsView()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          <span>Programas de Mantenimiento</span>
        </button>
        <button class="sidebar-nav-item" id="nav-item-inspeccion" onclick="App.openModuleInspection()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          <span>Nueva Inspección Pre-Uso</span>
        </button>
        <button class="sidebar-nav-item" id="nav-item-docs" onclick="App.openUploadDocModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
          <span>Subir Documento</span>
        </button>
      </nav>

      <div class="sidebar-nav-group-title">ADMINISTRACIÓN & HERRAMIENTAS</div>
      <nav class="sidebar-nav">
        <button class="sidebar-nav-item" id="nav-item-qr" onclick="App.openQRScannerModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 6.5v3h-3v-3h3M11 5H5v6h6V5zm-1.5 9.5v3h-3v-3h3M11 13H5v6h6v-6zm9.5-6.5v3h-3v-3h3M19 5h-6v6h6V5zm-6 8h1.5v1.5H13V13zm1.5 1.5H16V16h-1.5v-1.5zM16 13h1.5v1.5H16V13zm-3 3h1.5v1.5H13V16zm1.5 1.5H16V19h-1.5v-1.5zM16 16h1.5v1.5H16V16zm1.5-1.5H19V16h-1.5v-1.5zm0 3H19V19h-1.5v-1.5zM17.5 13H19v1.5h-1.5V13z"/></svg>
          <span>Escanear Código QR</span>
        </button>
        <button class="sidebar-nav-item" id="nav-item-print-qr" onclick="App.openPrintAllQRModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
          <span>Imprimir Placas QR</span>
        </button>
        <button class="sidebar-nav-item" id="nav-item-emails" onclick="App.openEmailsDrawer()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <span>Historial de Correos</span>
        </button>
        <a href="mobile.html" target="_blank" class="sidebar-nav-item sidebar-mobile-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
          <span>📱 Abrir App Móvil</span>
        </a>
      </nav>
    </aside>

    <!-- Main Enterprise Canvas Area -->
    <div class="enterprise-main-area">
      <!-- Top Enterprise Navigation Header -->
      <header class="enterprise-top-bar" id="main-app-header">
        <div class="enterprise-breadcrumb">
          <span style="color:#64748b; font-weight:600;">Panel Central</span>
          <span style="color:#cbd5e1; margin:0 6px;">/</span>
          <strong id="top-bar-page-label" style="color:#002b66; font-weight:800;">Consultar Flota de Grúas</strong>
        </div>

        <!-- Right Header Actions (QR Scanner, Emails, User Badge) -->
        <div class="header-actions">
          <!-- Quick QR Scanner Button -->
          <button class="icon-btn" id="btn-header-qr-scanner" onclick="App.openQRScannerModal()" title="Escanear Código QR de Unidad">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9.5 6.5v3h-3v-3h3M11 5H5v6h6V5zm-1.5 9.5v3h-3v-3h3M11 13H5v6h6v-6zm9.5-6.5v3h-3v-3h3M19 5h-6v6h6V5zm-6 8h1.5v1.5H13V13zm1.5 1.5H16V16h-1.5v-1.5zM16 13h1.5v1.5H16V13zm-3 3h1.5v1.5H13V16zm1.5 1.5H16V19h-1.5v-1.5zM16 16h1.5v1.5H16V16zm1.5-1.5H19V16h-1.5v-1.5zm0 3H19V19h-1.5v-1.5zM17.5 13H19v1.5h-1.5V13z"/>
            </svg>
          </button>

          <!-- Sent Emails Drawer Button -->
          <button class="icon-btn" id="btn-header-emails" onclick="App.openEmailsDrawer()" title="Ver Correos de Notificación Enviados">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            <span class="badge-count" id="email-badge-count">1</span>
          </button>

          <!-- User Role Display -->
          <div class="user-badge" id="header-user-display" title="Usuario activo en el sistema">
            <!-- Rendered dynamically by App.js -->
          </div>
        </div>
      </header>

      <!-- Main Application Canvas -->
      <main class="enterprise-content-canvas">
        <div id="app-main-content">
          <!-- Injected dynamically by App.renderDashboardView() or in-page forms -->
        </div>
      </main>
    </div>
  </div>

  <!-- Mount Point for Dialogs, Inspection Forms, QR Plates and Modals -->
  <div id="modal-mount-point"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/qr-engine.js?v=2.5"></script>
  <script src="js/app.js?v=2.5"></script>
</body>
</html>
